name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  java:
    name: Flink / Maven
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build and test Flink job
        run: mvn -B -ntp clean verify -f flink-job/pom.xml

  go:
    name: Go forwarder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-forwarder/go.mod
          cache: true

      - name: Download Go dependencies
        working-directory: go-forwarder
        run: go mod download

      - name: Test Go code
        working-directory: go-forwarder
        run: go test ./...

      - name: Build forwarder
        working-directory: go-forwarder
        run: go build ./cmd/forwarder

      - name: Build load generator
        working-directory: go-forwarder
        run: go build ./cmd/loadgen

  python:
    name: Python tooling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python syntax
        run: python -m compileall -q ml-model tools

  compose:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose file
        run: docker compose config -q
