node_id: forwarder-01

kafka:
  brokers:
    - kafka:9092
  topic: siem.raw.events
  batch_size: 500
  batch_timeout: 1s
  compression: snappy
  required_acks: 1   # use -1 for all-ISR durability on compliance-sensitive sources
  max_retries: 5

metrics:
  enabled: true
  addr: ":9109"

sources:
  - type: file
    source_type: auth
    path: /var/log/auth.log
    from_beginning: false

  - type: file
    source_type: dns
    path: /var/log/named/query.log
    from_beginning: false

  - type: syslog_udp
    source_type: firewall
    listen_addr: "0.0.0.0:5514"
